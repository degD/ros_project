local_costmap:
  global_frame: world
  robot_base_frame: firefly/base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.1
  transform_tolerance: 0.5

  plugins:
    - { name: obstacle_layer,  type: "costmap_2d::ObstacleLayer" }
    - { name: voxel_layer,     type: "costmap_2d::VoxelLayer" }
    - { name: inflation_layer,  type: "costmap_2d::InflationLayer" }

  voxel_layer:
    observation_sources: octomap_sensor
    octomap_sensor:
      data_type: PointCloud2
      topic: /firefly/octomap_point_cloud_centers
      marking: true
      clearing: true
      min_obstacle_height: -999.0
      max_obstacle_height: 999.0
    publish_voxel_map: true
    origin_z: -1.0
    z_voxels: 32
    z_resolution: 0.1


  obstacle_layer:
    observation_sources: octomap_sensor
    octomap_sensor:
      data_type: PointCloud2
      topic: /firefly/octomap_point_cloud_centers
      marking: true
      clearing: true
      min_obstacle_height: -999.0
      max_obstacle_height:  999.0


  inflation_layer:
    inflation_radius: 1.0

voxel_layer:
  debug: true