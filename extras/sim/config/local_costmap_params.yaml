local_costmap:
  global_frame: world
  robot_base_frame: firefly/base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.1
  transform_tolerance: 0.5

  plugins:
    - { name: obstacle_layer,  type: "costmap_2d::ObstacleLayer" }
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }

  obstacle_layer:
    observation_sources: vi_sensor_cloud
    vi_sensor_cloud:
      data_type: PointCloud2
      topic: /filtered_octomap
      marking: true
      clearing: true
      min_obstacle_height: -0.5         # adjust as needed based on drone's mounting
      max_obstacle_height: 3.0          # avoid noise or ceiling hits
      expected_update_rate: 2.0         # cells expire if not seen again in 2s
      observation_persistence: 0.0      # do not retain stale points after expiration

  inflation_layer:
    inflation_radius: 1.0